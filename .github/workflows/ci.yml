name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Typecheck + build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Install headless Chromium
        run: npx playwright-core install --with-deps chromium
      - name: Browser end-to-end tests (SwiftShader WebGL)
        run: npm run test:e2e
      - name: Same-camera gallery (artifact)
        run: node cli/molart.mjs gallery public/samples/1TIM.cif --size 768 --seed 42 --output-dir outputs/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renders
          path: outputs/
